# Optional parity stack. Local development does NOT require Docker — see
# docs/decisions.md ADR-002. If you use this, point DATABASE_URL at port 5433.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pbs
      POSTGRES_PASSWORD: pbs
      POSTGRES_DB: persona_builder_studio
    ports: ["5433:5432"]
    volumes: ["pbs-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pbs -d persona_builder_studio"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["pbs-redisdata:/data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pbsminio
      MINIO_ROOT_PASSWORD: pbsminio123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["pbs-miniodata:/data"]

volumes:
  pbs-pgdata:
  pbs-redisdata:
  pbs-miniodata:
